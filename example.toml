[imageflux]
token = ""
encrypt-key-uri = ""
event_webhook_url=""

# 1080p
[[ imageflux.hls ]]
duration-seconds = 1
start-time-offset = -10

[ imageflux.hls.video ]
width = 1920
height = 1080
fps = 30
bps = 12000000

[ imageflux.hls.audio ]
bps = 160000

[ imageflux.hls.archive ]
archive_destination_id=""

